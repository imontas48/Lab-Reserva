; Ajustes de PHP para produccion. La imagen oficial no trae php.ini activo, asi
; que sin este fichero se aplican los valores por defecto de PHP.
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = America/Santo_Domingo

; OPcache: el codigo no cambia en caliente dentro de la imagen, asi que no hace
; falta comprobar timestamps en cada peticion.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

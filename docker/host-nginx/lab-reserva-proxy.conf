# Cabeceras comunes del proxy inverso hacia el contenedor de Lab-Reserva.
# Se instala en /etc/nginx/snippets/lab-reserva-proxy.conf.
#
# Laravel lee X-Forwarded-* porque el contenedor arranca con TRUSTED_PROXIES=*:
# sin ellas el throttle veria a todos los usuarios con la misma IP, las URL
# generadas saldrian en http y sin el prefijo /lab-reserva.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Forwarded-Prefix /lab-reserva;
proxy_read_timeout 60s;

# Las cabeceras de seguridad se repiten en cada location de Lab-Reserva porque
# nginx no hereda add_header del bloque server cuando la location define alguna.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP en modo bloqueo. 'unsafe-inline' solo en estilos: Vue, SweetAlert2 y el
# datepicker escriben estilos en linea; los scripts son todos ficheros propios.
# Las fuentes vienen de fonts.bunny.net (resources/views/app.blade.php).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' data: https://fonts.bunny.net; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# Lab-Reserva bajo un subdirectorio de un sitio existente
# (por ejemplo https://portal.ejemplo.edu/lab-reserva).
#
# Se instala en /etc/nginx/snippets/lab-reserva-location.conf y se incluye con
# una sola linea dentro del bloque `server` 443 del vhost del sitio principal:
#     include snippets/lab-reserva-location.conf;
# Asi el vhost del sitio principal sigue siendo suyo y este fichero se puede
# retirar sin tocar nada mas.
#
# Como funciona:
#   * `^~` gana a las `location ~ \.php$` y `~ /\.` del sitio principal: sin el,
#     una peticion a /lab-reserva/index.php acabaria en su php-fpm.
#   * proxy_pass con barra final recorta /lab-reserva/ antes de reenviar; el
#     contenedor ve la ruta desde la raiz y recupera el prefijo por
#     X-Forwarded-Prefix (Laravel lo acepta porque confia en el proxy).
#   * add_header no se hereda cuando la location define alguna cabecera, por
#     eso se repiten aqui las de seguridad del bloque server.
#   * Rate limit en los cuatro endpoints publicos de la API: es la barrera que
#     actua antes de que la peticion llegue a PHP. La zona `autenticacion`
#     (10 req/min por IP) esta en conf.d/00-endurecimiento.conf.

location = /lab-reserva {
    return 301 /lab-reserva/;
}

location = /lab-reserva/api/v1/login {
    limit_req zone=autenticacion burst=5 nodelay;
    proxy_pass http://lab_reserva_web/api/v1/login;
    include snippets/lab-reserva-proxy.conf;
}

location = /lab-reserva/api/v1/register {
    limit_req zone=autenticacion burst=5 nodelay;
    proxy_pass http://lab_reserva_web/api/v1/register;
    include snippets/lab-reserva-proxy.conf;
}

location = /lab-reserva/api/v1/forgot-password {
    limit_req zone=autenticacion burst=5 nodelay;
    proxy_pass http://lab_reserva_web/api/v1/forgot-password;
    include snippets/lab-reserva-proxy.conf;
}

location = /lab-reserva/api/v1/reset-password {
    limit_req zone=autenticacion burst=5 nodelay;
    proxy_pass http://lab_reserva_web/api/v1/reset-password;
    include snippets/lab-reserva-proxy.conf;
}

location ^~ /lab-reserva/ {
    proxy_pass http://lab_reserva_web/;
    include snippets/lab-reserva-proxy.conf;
}

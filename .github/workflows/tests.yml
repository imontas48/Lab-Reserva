name: Tests

on:
  push:
    # La rama por defecto de este repositorio es main. El workflow heredado del
    # esqueleto de Laravel escuchaba master y *.x, asi que nunca llego a
    # ejecutarse en un push: solo en pull requests y en el cron diario.
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecucion anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json exige php ^8.2. Se cubren el minimo soportado y la
        # version de desarrollo; la matriz de 3 versiones triplicaba el tiempo
        # sin cubrir nada que estas dos no cubran.
        php: ['8.2', '8.4']

    name: PHP ${{ matrix.php }}

    services:
      mysql:
        # La aplicacion corre sobre MySQL. Las pruebas se ejecutaban en SQLite
        # en memoria, que no crea indices implicitos para las claves foraneas ni
        # reproduce el bloqueo de filas de InnoDB.
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: lab_reserva_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lab_reserva_testing
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        # Antes de las pruebas: cualquier ruta que renderice la vista de la SPA
        # ejecuta @vite, que falla sin public/build/manifest.json. public/build
        # esta en .gitignore, asi que el CI debe construirlo.
        run: pnpm build

      - name: Run migrations
        # Redundante con RefreshDatabase, pero aisla un fallo de esquema de un
        # fallo de prueba: si esta paso falla, el problema es una migracion.
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit

      - name: Audit JS dependencies
        run: pnpm audit

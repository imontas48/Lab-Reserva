<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin: 0 0 1rem 0;
        }
        .info {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 1rem;
            margin: 1rem 0;
        }
        .success {
            color: #059669;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Test Page</h1>
        <div class="info">
            <p class="success">✅ El servidor está funcionando correctamente</p>
            <p><strong>URL:</strong> <code>http://lab-reserva.test/test.html</code></p>
            <p><strong>Vite Dev Server:</strong> <code>http://localhost:5173</code></p>
        </div>
        <div>
            <p>Si puedes ver esta página, el servidor web está funcionando.</p>
            <p>Ahora verifica que Vite esté sirviendo los assets de Vue.</p>
        </div>
        <div style="margin-top: 2rem;">
            <a href="/login" style="display: inline-block; background: #0ea5e9; color: white; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px;">
                Ir a Login
            </a>
        </div>
    </div>
</body>
</html>

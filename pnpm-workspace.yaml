# Este proyecto no es un monorepo. El fichero existe porque pnpm 10+ lee aqui su
# configuracion, y sin allowBuilds el script de instalacion de esbuild queda
# bloqueado y `pnpm build` falla.
#
# Nota: con este fichero presente, `pnpm add` aborta con
# "Cannot destructure property 'manifest'". Para anadir dependencias hay que
# apartarlo temporalmente y devolverlo despues.
allowBuilds:
  esbuild: true

# Parche de seguridad en una dependencia transitiva: concurrently fija shell-quote 1.9.0
# (inyeccion de comandos en quote()) incluso en su ultima 9.x.
overrides:
  shell-quote: ^1.11.0
